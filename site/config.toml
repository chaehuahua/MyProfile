baseURL = "https://chaehuahua.github.io/MyProfile/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
hasCJKLanguage = true

pagination.pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

[params]
  contentTypeName = "posts"
  showMenuItems = 2
  fullWidthTheme = false
  centerTheme = false

[languages]
  [languages.ko]
    title = "채다연 | Portfolio"
    languageName = "한국어"
    copyright = ""
    [languages.ko.params]
      subtitle = "생명 정보를 데이터로 읽고 싶은 바이오메디컬공학부 학생 채다연의 포트폴리오"
      keywords = "채다연, 포트폴리오, 바이오메디컬공학, 생명정보학, 전북대학교"
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      [languages.ko.params.logo]
        logoText = "~/chae-dayeon"
        logoHomeLink = "/"

    [languages.ko.menu]
      [[languages.ko.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about"
      [[languages.ko.menu.main]]
        identifier = "showcase"
        name = "Showcase"
        url = "/showcase"
