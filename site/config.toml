baseURL = "https://chaehuahua.github.io/MyProfile/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
hasCJKLanguage = true

pagination.pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

[params]
  contentTypeName = "posts"
  showMenuItems = 5
  fullWidthTheme = false
  centerTheme = false

[languages]
  [languages.ko]
    title = "채다연 | Portfolio"
    languageName = "한국어"
    copyright = "© 2026 채다연"
    [languages.ko.params]
      subtitle = "생명 정보를 데이터로 읽고 싶은 바이오메디컬공학부 학생 채다연의 포트폴리오"
      keywords = "채다연, 포트폴리오, 바이오메디컬공학, 생명정보학, 전북대학교"
      menuMore = "더 보기"
      readMore = "자세히 보기"
      readOtherPosts = "다른 글 보기"
      [languages.ko.params.logo]
        logoText = "~/chae-dayeon"

    [languages.ko.menu]
      [[languages.ko.menu.main]]
        identifier = "home"
        name = "홈"
        pageRef = "/"
        weight = 1
      [[languages.ko.menu.main]]
        identifier = "about"
        name = "소개"
        pageRef = "/about"
        weight = 2
      [[languages.ko.menu.main]]
        identifier = "activity"
        name = "대표 활동"
        pageRef = "/posts/first-webpage"
        weight = 3
      [[languages.ko.menu.main]]
        identifier = "github"
        name = "GitHub ↗"
        url = "https://github.com/chaehuahua"
        weight = 4
        [languages.ko.menu.main.params]
          newTab = true
