baseURL = "https://chaehuahua.github.io/MyProfile/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
hasCJKLanguage = true

pagination.pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

[params]
  contentTypeName = "posts"
  showMenuItems = 2
  fullWidthTheme = false
  centerTheme = false

[languages]
  [languages.ko]
    title = "Terminal"
    languageName = "한국어"
    copyright = ""
    [languages.ko.params]
      subtitle = "A simple, retro theme for Hugo"
      keywords = ""
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      [languages.ko.params.logo]
        logoText = "Terminal"
        logoHomeLink = "/"

    [languages.ko.menu]
      [[languages.ko.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about"
      [[languages.ko.menu.main]]
        identifier = "showcase"
        name = "Showcase"
        url = "/showcase"
